<rect x="192.0" y="124.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="295.0" y="159.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">Calls the studio number</text>
<text x="295.0" y="174.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">(any hour, incl. after 7pm)</text>
<rect x="442.0" y="124.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="545.0" y="152.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Says what they need: rooms,</text>
<text x="545.0" y="167.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">locality, size, timeline,</text>
<text x="545.0" y="182.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">who decides, phone no.</text>
<rect x="1442.0" y="124.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="1545.0" y="152.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Hears an honest outcome:</text>
<text x="1545.0" y="167.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">&quot;a designer will call you&quot;</text>
<text x="1545.0" y="182.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">or a warm, specific decline</text>
<rect x="192.0" y="242.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="295.0" y="270.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Answers instantly</text>
<text x="295.0" y="285.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">1st line: AI assistant +</text>
<text x="295.0" y="300.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">call is recorded</text>
<rect x="692.0" y="242.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="795.0" y="262.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">System prompt: 5 criteria,</text>
<text x="795.0" y="277.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">Pune/PCMC localities, exact</text>
<text x="795.0" y="292.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">pricing line, decline lines</text>
<text x="795.0" y="307.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">(pricing.md never loaded)</text>
<rect x="942.0" y="242.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="1045.0" y="262.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">One question at a time;</text>
<text x="1045.0" y="277.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">reads back phone number;</text>
<text x="1045.0" y="292.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">STT keywords + pronunciation</text>
<text x="1045.0" y="307.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">dictionary for localities</text>
<rect x="1192.0" y="242.0" width="206" height="78" rx="7" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.3"/>
<text x="1295.0" y="270.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Vaani LLM runs the</text>
<text x="1295.0" y="285.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">conversation (temp 0.2);</text>
<text x="1295.0" y="300.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">never quotes a price</text>
<rect x="1442.0" y="242.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="1545.0" y="270.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Post-call webhook:</text>
<text x="1545.0" y="285.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">transcript, summary,</text>
<text x="1545.0" y="300.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">extracted fields, recording</text>
<rect x="192.0" y="360.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="295.0" y="388.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">call_postprocessing</text>
<text x="295.0" y="403.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">→ /api/vaani/webhook</text>
<text x="295.0" y="418.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">(secret token checked)</text>
<rect x="442.0" y="360.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="545.0" y="388.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Logs raw payload + call row</text>
<text x="545.0" y="403.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">(every call, even on error);</text>
<text x="545.0" y="418.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">redacts phone numbers</text>
<rect x="692.0" y="360.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="795.0" y="388.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">qualified.md + services.md</text>
<text x="795.0" y="403.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">(Nikhil&#x27;s rubric, scope),</text>
<text x="795.0" y="418.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">locality list</text>
<rect x="942.0" y="360.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="1045.0" y="380.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">Rules in code: locality</text>
<text x="1045.0" y="395.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">fuzzy match, price-leak scan,</text>
<text x="1045.0" y="410.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">dropped-call merge (30 min),</text>
<text x="1045.0" y="425.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">repeat caller, decide()</text>
<rect x="1442.0" y="360.0" width="206" height="78" rx="7" fill="#fdf6f0" stroke="#9a4a1c" stroke-width="1.3"/>
<text x="1545.0" y="380.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">Routes by outcome:</text>
<text x="1545.0" y="395.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">qualified → Telegram + HubSpot</text>
<text x="1545.0" y="410.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">complaint → Nikhil</text>
<text x="1545.0" y="425.5" font-size="11.5" fill="#1c1a17" text-anchor="middle">every call → dashboard</text>
<rect x="1192.0" y="478.0" width="206" height="78" rx="7" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.3"/>
<text x="1295.0" y="506.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Verdict as JSON: 5 criteria</text>
<text x="1295.0" y="521.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">+ scope, fields, flags</text>
<text x="1295.0" y="536.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">(no phone/email sent)</text>
<rect x="692.0" y="596.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="795.0" y="624.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Earlier enquiries for</text>
<text x="795.0" y="639.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">this caller (repeat /</text>
<text x="795.0" y="654.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">previously dropped)</text>
<rect x="942.0" y="596.0" width="206" height="78" rx="7" fill="#ffffff" stroke="#8f877b" stroke-width="1.3"/>
<text x="1045.0" y="624.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Stores callers (PII only),</text>
<text x="1045.0" y="639.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">enquiries, calls, events,</text>
<text x="1045.0" y="654.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">per-call cost</text>
<rect x="1442.0" y="714.0" width="206" height="78" rx="7" fill="#fdf6f0" stroke="#9a4a1c" stroke-width="1.3"/>
<text x="1545.0" y="742.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Lead note + Claim / Pass</text>
<text x="1545.0" y="757.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">to designers&#x27; group;</text>
<text x="1545.0" y="772.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">complaints + SLA → Nikhil</text>
<rect x="1442.0" y="832.0" width="206" height="78" rx="7" fill="#fdf6f0" stroke="#9a4a1c" stroke-width="1.3"/>
<text x="1545.0" y="860.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Contact + deal in</text>
<text x="1545.0" y="875.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">&#x27;Aangan Enquiries&#x27; pipeline</text>
<text x="1545.0" y="890.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">(₹11 L default value)</text>
<rect x="1442.0" y="950.0" width="206" height="78" rx="7" fill="#fdf6f0" stroke="#9a4a1c" stroke-width="1.3"/>
<text x="1545.0" y="978.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Designer taps Claim / Booked /</text>
<text x="1545.0" y="993.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Signed → HubSpot stage moves;</text>
<text x="1545.0" y="1008.0" font-size="11.5" fill="#1c1a17" text-anchor="middle">Nikhil reads the dashboard</text>
<text x="20" y="1078" font-size="12" fill="#6b655c">• Booking: Vaani&#x27;s Cal.com integration is OFF — the call only collects preferred slots; the designer who claims the lead confirms the time.</text>
<text x="20" y="1098" font-size="12" fill="#6b655c">• Guardrails: no price is ever spoken (agent turns are scanned after every call); phone numbers never reach the LLM; PII lives only in the callers table.</text>
<text x="20" y="1118" font-size="12" fill="#6b655c">• Reliability: a health check (DB, Telegram, HubSpot, Vaani) + SLA escalation runs on a cron and alerts Nikhil on Telegram; every webhook body is logged.</text>
<rect x="1170" y="1146" width="18" height="12" rx="3" fill="#ffffff" stroke="#8f877b"/>
<text x="1194" y="1156" font-size="12" fill="#1c1a17">Step</text>
<rect x="1320" y="1146" width="18" height="12" rx="3" fill="#eef4fc" stroke="#2a78d6"/>
<text x="1344" y="1156" font-size="12" fill="#1c1a17">AI step</text>
<rect x="1470" y="1146" width="18" height="12" rx="3" fill="#fdf6f0" stroke="#9a4a1c"/>
<text x="1494" y="1156" font-size="12" fill="#1c1a17">What people see / receive</text>
